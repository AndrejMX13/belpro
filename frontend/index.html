<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BelPro — Upravljalna plošča</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

<!-- Login screen -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">BelPro</div>
    <p class="login-subtitle">Upravljalna plošča za prostovoljce</p>
    <form id="login-form">
      <div class="field">
        <label for="login-password">Geslo</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Prijava</button>
      <p id="login-error" class="error-text" hidden>Napačno geslo. Poskusite znova.</p>
    </form>
  </div>
</div>

<!-- App shell -->
<div id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div id="sidebar-ngo-logo-wrap" style="display:none;padding:1rem 1rem 0.5rem;text-align:center">
      <img src="/api/logo" alt="Logotip organizacije" style="max-width:80%;max-height:56px;object-fit:contain"
           onload="document.getElementById('sidebar-ngo-logo-wrap').style.display='block'"
           onerror="document.getElementById('sidebar-ngo-logo-wrap').style.display='none'">
    </div>
    <div class="sidebar-brand">
      <span class="brand-logo">B</span>
      <span class="brand-name">BelPro</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#volunteers" class="nav-item active" data-page="volunteers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Prostovoljci
      </a>
      <a href="#approvals" class="nav-item" data-page="approvals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>
        Dnevniki
      </a>
      <a href="#analytics" class="nav-item" data-page="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analitika
      </a>
      <a href="#reports" class="nav-item" data-page="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Poročila
      </a>
      <a href="#settings" class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Nastavitve
      </a>
    </nav>
    <div class="sidebar-footer">
      <button id="logout-btn" class="btn-logout">Odjava</button>
    </div>
  </aside>

  <div class="content-wrapper" id="content-wrapper">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Odpri meni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title" id="topbar-title">Prostovoljci</span>
    </header>
    <main id="main-content" class="main-content"></main>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay" hidden>
  <div class="modal" id="modal-box" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="modal-title" class="modal-title"></h2>
      <button class="modal-close" id="modal-close" aria-label="Zapri">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/volunteers.js"></script>
<script src="/js/reports.js"></script>
<script src="/js/analytics.js"></script>
</body>
</html>
