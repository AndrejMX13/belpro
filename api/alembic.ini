[alembic]
script_location = db/migrations

# Prepend api/ (the container's WORKDIR /app) to sys.path so that
# env.py can do:  from models import Base; from core.settings import get_settings
prepend_sys_path = .

# sqlalchemy.url is intentionally blank — env.py overrides it at runtime
# using Settings().database_url to avoid embedding credentials here.
sqlalchemy.url =

# Migration file naming: YYYYMMDD_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Alembic locks the database during migrations to prevent race conditions.
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
