# Rate-limit zones (http context — included by the main nginx.conf http block).
# Managers endpoints carry credentials on every request; conservative limit deters brute-force.
# General API traffic gets a looser limit sized for a single NGO on a local network.
limit_req_zone $binary_remote_addr zone=managers:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m     rate=20r/s;

server {
    listen 80;
    server_name _;

    # Static manager dashboard
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* to FastAPI backend
    # Variable in proxy_pass forces runtime DNS resolution (no stale IP after container rebuilds)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Managers endpoints — auth on every call; stricter limit (10 req/min, burst 5).
    location /api/managers/ {
        limit_req zone=managers burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 20M;
        set $api_upstream api:8000;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # All other API traffic — generous limit for normal use, blocks naive floods.
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 20M;
        set $api_upstream api:8000;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
