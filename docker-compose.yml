services:

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 18 — single instance, three logical databases:
  #   belpro   → FastAPI application data (init.sql schema)
  #   n8n      → n8n uses its own schema within belpro DB (no extra DB needed)
  #   evolution → Evolution API tables (created by create_extra_dbs.sh)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      TZ: Europe/Ljubljana
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql    # PG18: mount parent dir, not /data subdir
      - ./db/create_extra_dbs.sh:/docker-entrypoint-initdb.d/00_extra_dbs.sh:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Redis 7 — Evolution API in-memory queue / cache
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:ee64a64eaab618d88051c3ade8f6352d11531fcf79d9a4818b9b183d8c1d18ba  # redis:7-alpine 2026-05-09
    restart: unless-stopped
    environment:
      TZ: Europe/Ljubljana
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # n8n — Workflow engine (all business logic orchestration)
  # Dashboard: http://localhost:5678
  # ─────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.18.5
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Postgres backend — uses 'n8n' schema within the belpro database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      # Auth
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      # Webhook URL must be reachable by Evolution API
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      GENERIC_TIMEZONE: Europe/Ljubljana
      TZ: Europe/Ljubljana
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # Faster-Whisper — Local CPU speech-to-text (Slovenian)
  # Internal only — not exposed outside the stack
  # ─────────────────────────────────────────────────────────────
  whisper:
    build: ./whisper
    restart: unless-stopped
    environment:
      TZ: Europe/Ljubljana
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-sl}
    volumes:
      - whisper_models:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ─────────────────────────────────────────────────────────────
  # FastAPI — Backend API + PDF generation
  # Dashboard API: http://localhost:8100  (http://localhost:8100/docs for Swagger)
  # ─────────────────────────────────────────────────────────────
  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EMSO_ENCRYPTION_KEY: ${EMSO_ENCRYPTION_KEY}
      API_SECRET_KEY: ${API_SECRET_KEY}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      WHISPER_SERVICE_URL: http://whisper:8001
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}  # used by EvolutionClient (api/services/evolution.py) to call fetchInstances
      NGO_WHATSAPP_PHONE: ${NGO_WHATSAPP_PHONE:-}         # seeds DB on first boot if set; kept in sync by api/main.py
      MAX_PHOTOS_PER_ENTRY: ${MAX_PHOTOS_PER_ENTRY:-5}
      SESSION_DURATION_HOURS: ${SESSION_DURATION_HOURS:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-False}
      TZ: Europe/Ljubljana
    volumes:
      - api_photos:/app/photos
      - ./data/logo:/app/photos/logo
      - api_pdfs:/app/pdfs
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  # Ops sidecar — automated backups, photo retention cleanup
  # ─────────────────────────────────────────────────────────────
  ops:
    build: ./ops
    restart: unless-stopped
    environment:
      TZ: Europe/Ljubljana
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      API_URL: http://api:8000
      API_SECRET_KEY: ${API_SECRET_KEY}
      PHOTO_RETENTION_DAYS: ${PHOTO_RETENTION_DAYS:-730}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - api_photos:/app/photos:ro
      - api_pdfs:/app/pdfs:ro
      - backups:/backups
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # nginx — Reverse proxy + static manager dashboard
  # Dashboard: http://localhost:80
  # ─────────────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de  # nginx:alpine 2026-05-09
    restart: unless-stopped
    environment:
      TZ: Europe/Ljubljana
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # Evolution API — WhatsApp gateway (volunteer messaging)
  # API: http://localhost:8180
  # ─────────────────────────────────────────────────────────────
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8180}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_belpro
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evo
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1035194821"
      WPP_LID_MODE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP: "true"
      LOG_LEVEL: DEBUG
      LOG_BAILEYS: debug
      LOG_COLOR: "false"
      TZ: Europe/Ljubljana
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  whisper_models:
  api_photos:
  api_pdfs:
  evolution_instances:
  backups:
